[package]
name = "leaf-reader"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
rfd = "0.15"
open = "5"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
